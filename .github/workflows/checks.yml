name: checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install test tooling without the optional ML runtime
        run: python -m pip install -e '.[dev,mcp]'
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type checks
        run: python -m mypy src scripts
      - name: Unit and CLI checks
        run: python -m pytest -rA

  numerical:
    name: CPU tensor contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install CPU tensor runtime and test tooling
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,mcp,model]'
      - name: Check local numerical dependencies
        run: python -c "import torch, transformers, safetensors; assert not torch.cuda.is_available(); print(torch.__version__)"
      - name: Exercise synthetic tensor and checkpoint contracts offline
        run: python -m pytest -rA
