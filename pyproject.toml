[project]
name = "lacunai"
version = "0.1.0"
description = "Bounded experimental model unlearning and independent recoverability evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LacunAI contributors" }]
keywords = ["ai", "unlearning", "research", "evaluation", "model-editing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5"]
experimental = ["torch==2.9.1", "transformers==4.51.3", "safetensors==0.5.3", "numpy==2.2.6"]

[project.scripts]
lacunai = "lacunai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacunai"]
artifacts = ["src/lacunai/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
